<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スケジューラー（Todo兼用）</title>
<style>
  :root {
    --bg: #1a1b1e;
    --card-bg: #232428;
    --border: #33343a;
    --text: #e8e8ea;
    --text-muted: #8b8d94;
    --accent: #6c8cff;
    --accent-hover: #8aa4ff;
    --danger: #ff6b6b;
    --danger-hover: #ff8787;
    --header-color: #6c8cff;
    --header-text-color: #ffffff;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .app {
    width: 90vw;
    height: 80vh;
    display: flex;
    flex-direction: column;
  }

  h1 {
    margin: 0;
    font-size: 1.8rem;
    text-align: center;
  }

  .app-header {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    margin-bottom: 20px;
  }

  .header-settings {
    position: absolute;
    /* ブラウザの端スワイプ操作などの判定領域と被らないよう、画面端から少し離す */
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 21;
  }

  .header-settings-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: #1e1f23;
    color: var(--text);
    cursor: pointer;
    touch-action: manipulation;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .header-settings-btn:hover {
    background: var(--border);
  }

  .header-settings-menu {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    display: flex;
    flex-direction: column;
    min-width: 220px;
    background: #1e1f23;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    z-index: 20;
  }

  .header-settings-menu[hidden] {
    display: none;
  }

  .layout {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 24px;
    align-items: stretch;
  }

  .panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .add-task-dialog {
    width: min(520px, 90vw);
    max-height: 85vh;
    overflow-y: auto;
    background: #2a2826;
    color: #e6ded1;
    border: 1px solid #3d3a35;
    border-radius: 12px;
    padding: 28px;
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
  }

  .add-task-dialog::backdrop {
    background: rgba(0, 0, 0, 0.55);
  }

  .dialog-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 16px;
  }

  .weekday-setting-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }

  .weekday-setting-toggle input[type="checkbox"] {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    cursor: pointer;
  }

  .read-other-calendar-result {
    margin-top: 16px;
    max-height: 280px;
    overflow-y: auto;
  }

  .read-other-calendar-result .result-task {
    padding: 8px 0;
    border-bottom: 1px solid #3d3a35;
    font-size: 0.9rem;
  }

  .read-other-calendar-result .result-task:last-child {
    border-bottom: none;
  }

  .read-other-calendar-result .result-empty,
  .read-other-calendar-result .result-error {
    color: #a89d8c;
    font-size: 0.9rem;
    padding: 8px 0;
  }

  .calendar-panel {
    flex: 6;
    min-width: 0;
    position: relative;
    overflow: hidden;
    background: #f0f0f2;
    color: #1a1b1e;
  }

  .calendar-bg {
    position: absolute;
    inset: 0;
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    z-index: 0;
  }

  /* PC幅では写真を隙間なく敷き詰める（スマホ幅では上のcontain指定のまま、写真全体を表示） */
  @media (min-width: 821px) {
    .calendar-bg {
      background-size: cover;
    }
  }

  .calendar-overlay {
    position: absolute;
    inset: 0;
    background: color-mix(in srgb, var(--header-color) 25%, #f0f0f2 75%);
    opacity: 0.7;
    z-index: 1;
  }

  .calendar-content {
    position: relative;
    z-index: 2;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .bg-settings-menu-item {
    display: block;
    width: 100%;
    text-align: left;
    font-size: 0.85rem;
    padding: 8px 10px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }

  .bg-settings-menu-item:hover {
    background: var(--border);
  }

  .calendar-panel .calendar-header h2 {
    color: var(--header-text-color);
  }

  .calendar-panel .month-nav-btn {
    background: color-mix(in srgb, var(--header-text-color) 20%, transparent);
    color: var(--header-text-color);
    border: 1px solid color-mix(in srgb, var(--header-text-color) 40%, transparent);
  }

  .calendar-panel .month-nav-btn:hover {
    background: color-mix(in srgb, var(--header-text-color) 32%, transparent);
  }

  .calendar-panel .weekday {
    color: #8b8d94;
  }

  .calendar-panel .day-cell:hover {
    background: #e2e2e6;
  }

  .calendar-panel .day-cell.today {
    border-color: var(--accent);
  }

  .calendar-panel .day-cell.selected {
    background: var(--accent);
    color: #fff;
  }

  .calendar-panel .day-cell-task {
    background: rgba(108, 140, 255, 0.15);
    color: #2b3a67;
  }

  .calendar-panel .day-cell.selected .day-cell-task {
    background: rgba(255, 255, 255, 0.3);
    color: #fff;
  }

  .task-column {
    flex: 4;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .list-panel {
    flex: 1;
    min-height: 0;
    /* ヘッダー（見出しの帯）を枠の上端・左右端ギリギリに配置するため、
       パネル自体の余白はなくし、中身側（.list-body）で改めて余白を付け直す */
    padding: 0;
  }

  .list-body {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 12px 28px 28px;
  }

  .panel-title {
    margin: 0 0 16px;
    font-size: 1.2rem;
  }

  /* --- タスク表記エリア（目に優しい配色） --- */
  .task-column .panel {
    background: #2a2826;
    border-color: #3d3a35;
    color: #e6ded1;
  }

  .task-column .panel-title,
  .add-task-dialog .panel-title {
    color: #e6ded1;
  }

  .task-column .list-hint {
    color: #a89d8c;
  }

  .task-column #task-input,
  .task-column #task-date-input,
  .task-column #task-time-input,
  .task-column #task-detail-input,
  .task-column #task-color-input,
  .add-task-dialog #task-input,
  .add-task-dialog #task-date-input,
  .add-task-dialog #task-time-input,
  .add-task-dialog #task-detail-input,
  .add-task-dialog #task-color-input,
  .add-task-dialog #header-color-input {
    background: #221f1d;
    border-color: #3d3a35;
    color: #e6ded1;
  }

  .task-column .task-avatar {
    border-color: rgba(230, 222, 209, 0.35);
  }

  .task-column #task-input:focus,
  .task-column #task-date-input:focus,
  .task-column #task-time-input:focus,
  .task-column #task-detail-input:focus,
  .add-task-dialog #task-input:focus,
  .add-task-dialog #task-date-input:focus,
  .add-task-dialog #task-time-input:focus,
  .add-task-dialog #task-detail-input:focus {
    border-color: #7ea99a;
  }

  .task-column .advanced-settings,
  .add-task-dialog .advanced-settings {
    border-color: #3d3a35;
  }

  .task-column .advanced-settings summary,
  .add-task-dialog .advanced-settings summary {
    color: #a89d8c;
  }

  .task-column .repeat-settings select,
  .task-column .repeat-settings input[type="number"],
  .add-task-dialog .repeat-settings select,
  .add-task-dialog .repeat-settings input[type="number"] {
    background: #221f1d;
    border-color: #3d3a35;
    color: #e6ded1;
  }

  .task-column .repeat-settings select:focus,
  .task-column .repeat-settings input[type="number"]:focus,
  .add-task-dialog .repeat-settings select:focus,
  .add-task-dialog .repeat-settings input[type="number"]:focus {
    border-color: #7ea99a;
  }

  .task-column .weekday-checkboxes label,
  .add-task-dialog .weekday-checkboxes label {
    border-color: #3d3a35;
    color: #e6ded1;
  }

  .task-column #add-btn,
  .add-task-dialog #add-btn {
    background: #7ea99a;
    color: #1c1b19;
  }

  .task-column #add-btn:hover,
  .add-task-dialog #add-btn:hover {
    background: #93bcae;
  }

  .task-column .task-detail {
    color: #a89d8c;
  }

  .task-column #task-list li {
    border-bottom-color: #3d3a35;
  }

  .task-column #task-list input[type="checkbox"] {
    accent-color: #7ea99a;
  }

  .task-column .task-text {
    color: #e6ded1;
  }

  .task-column .task-edit-input {
    border-color: #7ea99a;
    background: #221f1d;
    color: #e6ded1;
  }

  .task-column .task-edit-date-input,
  .task-column .task-edit-time-input,
  .task-column .task-edit-color-input {
    border-color: #3d3a35;
    background: #221f1d;
  }

  .task-column .edit-save-btn {
    background: #7ea99a;
    color: #1c1b19;
  }

  .task-column .edit-save-btn:hover {
    background: #93bcae;
  }

  .task-column .edit-cancel-btn,
  .add-task-dialog .edit-cancel-btn {
    border-color: #3d3a35;
    color: #a89d8c;
  }

  .task-column .edit-cancel-btn:hover,
  .add-task-dialog .edit-cancel-btn:hover {
    background: #3d3a35;
  }

  .task-column .task-text.completed {
    color: #a89d8c;
  }

  .task-column .task-date {
    color: #a89d8c;
  }

  .task-column .edit-btn {
    border-color: #7ea99a;
    color: #7ea99a;
  }

  .task-column .edit-btn:hover {
    background: #7ea99a;
    color: #1c1b19;
  }

  .task-column .delete-btn {
    border-color: #d98a8a;
    color: #d98a8a;
  }

  .task-column .delete-btn:hover {
    background: #d98a8a;
    color: #2a2826;
  }

  .task-column .empty-message {
    color: #a89d8c;
  }

  .header-settings-menu {
    background: #221f1d;
    border-color: #3d3a35;
  }

  .header-settings-menu .bg-settings-menu-item {
    color: #e6ded1;
  }

  .header-settings-menu .bg-settings-menu-item:hover {
    background: #3d3a35;
  }

  /* --- カレンダー --- */
  .calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    /* パネル自体の余白(28px)を打ち消し、ヘッダーだけ枠の上端・左右端ギリギリまで広げる */
    margin: -28px -28px 16px -28px;
    padding: 12px 16px;
    border-radius: 10px;
    background: var(--header-color);
  }

  .calendar-header h2 {
    margin: 0;
    font-size: 1.4rem;
  }

  .month-nav-btn {
    border: 1px solid var(--border);
    background: #1e1f23;
    color: var(--text);
    border-radius: 6px;
    padding: 10px 16px;
    cursor: pointer;
    font-size: 1rem;
  }

  .month-nav-btn:hover {
    background: var(--border);
  }

  .weekday-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    margin-bottom: 8px;
  }

  .weekday {
    text-align: center;
    font-size: 0.95rem;
    color: var(--text-muted);
    padding: 4px 0;
  }

  .weekday.sun-text {
    color: #d32f2f;
  }

  .weekday.sat-text {
    color: #1565c0;
  }

  .calendar-grid {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-auto-rows: 1fr;
    gap: 8px;
  }

  .day-cell {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    border-radius: 10px;
    cursor: pointer;
    position: relative;
    padding: 6px;
    overflow: hidden;
  }

  .day-cell:hover {
    background: var(--border);
  }

  .day-cell.empty {
    cursor: default;
  }

  .day-cell.empty:hover {
    background: transparent;
  }

  .day-cell.today {
    border: 2px solid var(--accent);
  }

  .day-cell.sun-text .day-number {
    color: #d32f2f;
  }

  .day-cell.sat-text .day-number {
    color: #1565c0;
  }

  .day-cell.sun-bg {
    background: rgba(211, 47, 47, 0.1);
  }

  .day-cell.sat-bg {
    background: rgba(21, 101, 192, 0.1);
  }

  .day-cell.selected.sun-text .day-number,
  .day-cell.selected.sat-text .day-number {
    color: #fff;
  }

  .day-cell.holiday-text .day-number {
    color: #d32f2f;
  }

  .day-cell.holiday-bg {
    background: rgba(211, 47, 47, 0.1);
  }

  .day-cell.selected.holiday-text .day-number {
    color: #fff;
  }

  .day-cell.selected {
    background: var(--accent);
    color: #fff;
  }

  .day-cell-header {
    width: 100%;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 4px;
    margin-bottom: 4px;
    flex-shrink: 0;
  }

  .day-number {
    font-size: 1rem;
    font-weight: 600;
  }

  .rokuyo {
    font-size: 0.65rem;
    color: #9a9a9a;
    white-space: nowrap;
  }

  .rokuyo.taian {
    color: #d32f2f;
    font-weight: 600;
  }

  .rokuyo.butsumetsu {
    color: #bdbdbd;
  }

  .day-cell.selected .rokuyo {
    color: rgba(255, 255, 255, 0.85);
  }

  .day-cell.selected .rokuyo.taian,
  .day-cell.selected .rokuyo.butsumetsu {
    color: #fff;
  }

  .holiday-label {
    width: 100%;
    font-size: 0.62rem;
    color: #1a1b1e;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
  }

  .day-cell.holiday-text .holiday-label {
    color: #d32f2f;
  }

  .day-cell.selected .holiday-label {
    color: rgba(255, 255, 255, 0.85);
  }

  .day-cell.selected.holiday-text .holiday-label {
    color: #fff;
  }

  .day-cell-tasks {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: hidden;
  }

  .day-cell-task {
    width: 100%;
    font-size: 0.72rem;
    padding: 1px 5px;
    border-radius: 4px;
    background: rgba(108, 140, 255, 0.25);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .day-cell-task.completed {
    text-decoration: line-through;
    opacity: 0.6;
  }

  .day-cell-task {
    cursor: grab;
  }

  .day-cell-task:active {
    cursor: grabbing;
  }

  .day-cell.drag-over {
    outline: 2px dashed var(--accent);
    outline-offset: -2px;
  }

  #task-list li.dragging-source {
    opacity: 0.5;
    transform: scale(1.04);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
    border-radius: 10px;
    position: relative;
    z-index: 5;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  @keyframes drag-ghost-pop {
    0% {
      transform: translate(-50%, -130%) scale(0.6);
      opacity: 0;
    }
    60% {
      transform: translate(-50%, -130%) scale(1.12);
      opacity: 1;
    }
    100% {
      transform: translate(-50%, -130%) scale(1);
      opacity: 1;
    }
  }

  .drag-ghost {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1000;
    transform: translate(-50%, -130%);
    pointer-events: none;
    background: var(--accent);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 700;
    padding: 10px 18px;
    border-radius: 10px;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.4);
    max-width: 240px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    animation: drag-ghost-pop 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .day-cell.selected .day-cell-task {
    background: rgba(255, 255, 255, 0.3);
    color: #fff;
  }

  .filter-row-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 10px;
    background: var(--header-color);
  }

  .list-hint {
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  .filter-label {
    font-size: calc(1.2rem - 5pt);
    font-weight: 700;
    color: var(--header-text-color);
  }

  .add-task-btn {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid color-mix(in srgb, var(--header-text-color) 40%, transparent);
    background: color-mix(in srgb, var(--header-text-color) 20%, transparent);
    color: var(--header-text-color);
    font-size: 1.3rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .add-task-btn:hover {
    background: color-mix(in srgb, var(--header-text-color) 32%, transparent);
  }

  /* --- タスク入力 --- */
  .input-row {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 10px;
    margin-bottom: 14px;
  }

  .field-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .field-group[hidden] {
    display: none;
  }

  .field-group-wide {
    width: 100%;
    margin-bottom: 14px;
  }

  .advanced-settings {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
  }

  .advanced-settings summary {
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-muted);
    outline: none;
  }

  .advanced-settings[open] summary {
    margin-bottom: 12px;
  }

  .repeat-settings {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .repeat-settings select,
  .repeat-settings input[type="number"] {
    height: 40px;
    padding: 0 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #1e1f23;
    color: var(--text);
    font-size: 0.9rem;
    outline: none;
  }

  .repeat-settings select:focus,
  .repeat-settings input[type="number"]:focus {
    border-color: var(--accent);
  }

  .weekday-checkboxes {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .weekday-checkboxes label {
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.85rem;
    cursor: pointer;
  }

  .weekday-checkboxes input[type="checkbox"] {
    cursor: pointer;
  }

  .field-label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
  }

  #task-input {
    width: 100%;
    height: 44px;
    padding: 0 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #1e1f23;
    color: var(--text);
    font-size: 1.05rem;
    outline: none;
  }

  #task-date-input,
  #task-time-input {
    height: 44px;
    padding: 0 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #1e1f23;
    color: var(--text);
    font-size: 1rem;
    outline: none;
    color-scheme: dark;
  }

  #task-detail-input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #1e1f23;
    color: var(--text);
    font-size: 0.95rem;

<script>
  // URLの「?cal=」パラメータで指定された予定表を使う。指定がなければ、
  // この端末・このブラウザで前回使った予定表（なければ既定の"main"）を使う。
  // こうすることで、自分はいつも通り（パラメータなし＝main）のまま、
  // 友人には ?cal=任意の名前 を付けたリンクを渡すだけで、別の独立した予定表を使ってもらえる。
  function resolveCalendarId() {
    const params = new URLSearchParams(window.location.search);
    const fromUrl = (params.get('cal') || '').trim();
    if (fromUrl) {
      localStorage.setItem('calendarId', fromUrl);
      return fromUrl;
    }
    return localStorage.getItem('calendarId') || 'main';
  }

  const calendarId = resolveCalendarId();
  const LOCAL_TASKS_KEY = 'tasks:' + calendarId;
  const LOCAL_BG_KEY = 'calendarBgImage:' + calendarId;
  const LOCAL_SETTINGS_KEY = 'calendarSettings:' + calendarId;

  let tasks = [];
  let db = null;
  let tasksCollection = null;
  let settingsDocRef = null;
  let calendarSettingsDocRef = null;
  const DEFAULT_CALENDAR_SETTINGS = {
    weekStart: 0,
    weekdayColor: false,
    weekdayBg: false,
    weekdayEnglish: false,
    headerColor: '#6c8cff'
  };
  let calendarSettings = Object.assign({}, DEFAULT_CALENDAR_SETTINGS);

  const today = new Date();

  let selectedDate = todayStr();
  let editingTaskId = null;

  const taskRepeatInterval = document.getElementById('task-repeat-interval');
  const repeatWeekdayGroup = document.getElementById('repeat-weekday-group');
  const repeatMonthdayGroup = document.getElementById('repeat-monthday-group');
  const repeatCustomGroup = document.getElementById('repeat-custom-group');
  const weekdayCheckboxes = document.querySelectorAll('.weekday-checkboxes input[type="checkbox"]');

  function renderAll() {
    renderCalendar();
    renderTasks();

  function persistLocal() {
    localStorage.setItem(LOCAL_TASKS_KEY, JSON.stringify(tasks));
  }

  async function createTask(data) {
    if (tasksCollection) {
      await tasksCollection.add(data);
    } else {
      tasks.push(Object.assign({ id: String(Date.now()) }, data));
      persistLocal();
      renderAll();
    }
  }

  async function patchTask(id, data) {
    if (tasksCollection) {
      await tasksCollection.doc(id).update(data);
    } else {
      const task = tasks.find(t => t.id === id);
      if (task) {
        Object.assign(task, data);
        persistLocal();
        renderAll();
      }
    }
  }

  // 既存コードは「db.collection(path)」「db.doc(path)」という単純な形のAPIを前提に書かれているため、
  // Firestoreの実際の関数呼び出しをその形に合わせて薄くラップする。
  function wrapFirestoreDoc(ref, firestoreFns) {
    const { getDoc, setDoc, updateDoc, deleteDoc, onSnapshot } = firestoreFns;
    return {
      get: async () => {
        const snap = await getDoc(ref);
        return { exists: snap.exists(), data: () => snap.data() };
      },
      set: (data) => setDoc(ref, data),
      update: (data) => updateDoc(ref, data),
      delete: () => deleteDoc(ref),
      onSnapshot: (next, onError) => onSnapshot(
        ref,
        (snap) => next({ exists: snap.exists(), data: () => snap.data() }),
        onError
      )
    };
  }

  function wrapFirestoreCollection(ref, firestoreFns) {
    const { doc, addDoc, getDocs, onSnapshot } = firestoreFns;
    return {
      add: (data) => addDoc(ref, data),
      doc: (id) => wrapFirestoreDoc(doc(ref, id), firestoreFns),
      get: async () => {
        const snap = await getDocs(ref);
        return { docs: snap.docs.map(d => ({ id: d.id, data: () => d.data() })) };
      },
      onSnapshot: (next, onError) => onSnapshot(
        ref,
        (snap) => next({ docs: snap.docs.map(d => ({ id: d.id, data: () => d.data() })) }),
        onError
      )
    };
  }

      const firebaseApp = initializeApp(FIREBASE_CONFIG);
      const firestoreDb = getFirestore(firebaseApp);

      return {
        collection: (path) => wrapFirestoreCollection(collection(firestoreDb, path), firestoreFns),

  function formatDate(year, month, day) {
    const mm = String(month + 1).padStart(2, '0');
    const dd = String(day).padStart(2, '0');
    return `${year}-${mm}-${dd}`;
  }

  function todayStr() {
    return formatDate(today.getFullYear(), today.getMonth(), today.getDate());
  }

  // 六曜計算（旧暦変換）
  // 新暦→旧暦の変換は、Jean Meeus「Astronomical Algorithms」(1998) に基づく
  // 天文計算アルゴリズム（Ho Ngoc Duc実装）を日本標準時（UTC+9）向けに適用したもの。
  // 六曜は「（旧暦の月 + 旧暦の日）÷ 6」の余りから求める（余り0=大安,1=赤口,2=先勝,3=友引,4=先負,5=仏滅）。
  const LUNAR_PI = Math.PI;

  function lunarINT(d) {
    return Math.floor(d);
  }

  function jdFromDate(dd, mm, yy) {
    const a = lunarINT((14 - mm) / 12);
    const y = yy + 4800 - a;
    const m = mm + 12 * a - 3;
    let jd = dd + lunarINT((153 * m + 2) / 5) + 365 * y + lunarINT(y / 4) - lunarINT(y / 100) + lunarINT(y / 400) - 32045;
    if (jd < 2299161) {
      jd = dd + lunarINT((153 * m + 2) / 5) + 365 * y + lunarINT(y / 4) - 32083;
    }
    return jd;
  }

  function newMoon(k) {
    const T = k / 1236.85;
    const T2 = T * T;
    const T3 = T2 * T;
    const dr = LUNAR_PI / 180;
    let jd1 = 2415020.75933 + 29.53058868 * k + 0.0001178 * T2 - 0.000000155 * T3;
    jd1 = jd1 + 0.00033 * Math.sin((166.56 + 132.87 * T - 0.009173 * T2) * dr);
    const M = 359.2242 + 29.10535608 * k - 0.0000333 * T2 - 0.00000347 * T3;
    const Mpr = 306.0253 + 385.81691806 * k + 0.0107306 * T2 + 0.00001236 * T3;
    const F = 21.2964 + 390.67050646 * k - 0.0016528 * T2 - 0.00000239 * T3;
    let c1 = (0.1734 - 0.000393 * T) * Math.sin(M * dr) + 0.0021 * Math.sin(2 * dr * M);
    c1 = c1 - 0.4068 * Math.sin(Mpr * dr) + 0.0161 * Math.sin(dr * 2 * Mpr);
    c1 = c1 - 0.0004 * Math.sin(dr * 3 * Mpr);
    c1 = c1 + 0.0104 * Math.sin(dr * 2 * F) - 0.0051 * Math.sin(dr * (M + Mpr));
    c1 = c1 - 0.0074 * Math.sin(dr * (M - Mpr)) + 0.0004 * Math.sin(dr * (2 * F + M));
    c1 = c1 - 0.0004 * Math.sin(dr * (2 * F - M)) - 0.0006 * Math.sin(dr * (2 * F + Mpr));
    c1 = c1 + 0.0010 * Math.sin(dr * (2 * F - Mpr)) + 0.0005 * Math.sin(dr * (2 * Mpr + M));
    let deltat;
    if (T < -11) {
      deltat = 0.001 + 0.000839 * T + 0.0002261 * T2 - 0.00000845 * T3 - 0.000000081 * T * T3;
    } else {
      deltat = -0.000278 + 0.000265 * T + 0.000262 * T2;
    }
    return jd1 + c1 - deltat;
  }

  function sunLongitude(jdn) {
    const T = (jdn - 2451545.0) / 36525;
    const T2 = T * T;
    const dr = LUNAR_PI / 180;
    const M = 357.52910 + 35999.05030 * T - 0.0001559 * T2 - 0.00000048 * T * T2;
    const L0 = 280.46645 + 36000.76983 * T + 0.0003032 * T2;
    let DL = (1.914600 - 0.004817 * T - 0.000014 * T2) * Math.sin(dr * M);
    DL = DL + (0.019993 - 0.000101 * T) * Math.sin(dr * 2 * M) + 0.000290 * Math.sin(dr * 3 * M);
    let L = L0 + DL;
    L = L * dr;
    L = L - LUNAR_PI * 2 * lunarINT(L / (LUNAR_PI * 2));
    return L;
  }

  function getSunLongitude(dayNumber, timeZone) {
    return lunarINT(sunLongitude(dayNumber - 0.5 - timeZone / 24) / LUNAR_PI * 6);
  }

  function getNewMoonDay(k, timeZone) {
    return lunarINT(newMoon(k) + 0.5 + timeZone / 24);
  }

  function getLunarMonth11(yy, timeZone) {
    const off = jdFromDate(31, 12, yy) - 2415021;
    const k = lunarINT(off / 29.530588853);
    let nm = getNewMoonDay(k, timeZone);
    const sl = getSunLongitude(nm, timeZone);
    if (sl >= 9) {
      nm = getNewMoonDay(k - 1, timeZone);
    }
    return nm;
  }

  function getLeapMonthOffset(a11, timeZone) {
    const k = lunarINT((a11 - 2415021.076998695) / 29.530588853 + 0.5);
    let last = 0;
    let i = 1;
    let arc = getSunLongitude(getNewMoonDay(k + i, timeZone), timeZone);
    while (arc !== last && i < 14) {
      last = arc;
      i++;
      arc = getSunLongitude(getNewMoonDay(k + i, timeZone), timeZone);
    }
    return i - 1;
  }

  const JAPAN_TIME_ZONE = 9.0;

  function convertSolarToLunar(dd, mm, yy) {
    const dayNumber = jdFromDate(dd, mm, yy);
    const k = lunarINT((dayNumber - 2415021.076998695) / 29.530588853);
    let monthStart = getNewMoonDay(k + 1, JAPAN_TIME_ZONE);
    if (monthStart > dayNumber) {
      monthStart = getNewMoonDay(k, JAPAN_TIME_ZONE);
    }
    let a11 = getLunarMonth11(yy, JAPAN_TIME_ZONE);
    let b11 = a11;
    let lunarYear;
    if (a11 >= monthStart) {
      lunarYear = yy;
      a11 = getLunarMonth11(yy - 1, JAPAN_TIME_ZONE);
    } else {
      lunarYear = yy + 1;
      b11 = getLunarMonth11(yy + 1, JAPAN_TIME_ZONE);
    }
    const lunarDay = dayNumber - monthStart + 1;
    const diff = lunarINT((monthStart - a11) / 29);
    let lunarLeap = 0;
    let lunarMonth = diff + 11;
    if (b11 - a11 > 365) {
      const leapMonthDiff = getLeapMonthOffset(a11, JAPAN_TIME_ZONE);
      if (diff >= leapMonthDiff) {
        lunarMonth = diff + 10;
        if (diff === leapMonthDiff) {
          lunarLeap = 1;
        }
      }
    }
    if (lunarMonth > 12) {
      lunarMonth -= 12;
    }
    if (lunarMonth >= 11 && diff < 4) {
      lunarYear -= 1;
    }
    return { day: lunarDay, month: lunarMonth, year: lunarYear, leap: lunarLeap === 1 };
  }

  const ROKUYO_NAMES = ['大安', '赤口', '先勝', '友引', '先負', '仏滅'];

  function getRokuyo(year, month, day) {
    const lunar = convertSolarToLunar(day, month, year);
    return ROKUYO_NAMES[(lunar.month + lunar.day) % 6];
  }

  function taskOccursOnDate(task, dateStr) {
    if (task.date === dateStr) return true;
    if (!task.repeat) return false;
    const d = new Date(dateStr + 'T00:00:00');

    if (task.repeat.type === 'daily') {
      if (task.date) {
        return d >= new Date(task.date + 'T00:00:00');
      }
      return true;
    }
    if (task.repeat.type === 'weekly') {
      return task.repeat.weekdays.includes(d.getDay());
    }
    if (task.repeat.type === 'monthly') {
      return d.getDate() === task.repeat.day;
    }
    if (task.repeat.type === 'custom') {
      if (!task.date) return false;
      const start = new Date(task.date + 'T00:00:00');
      const diffDays = Math.round((d - start) / 86400000);
      if (diffDays < 0) return false;
      return diffDays % task.repeat.interval === 0;
    }
    return false;
  }

  function getContrastTextColor(hex) {
    const c = hex.replace('#', '');
    const r = parseInt(c.substring(0, 2), 16);
    const g = parseInt(c.substring(2, 4), 16);
    const b = parseInt(c.substring(4, 6), 16);
    const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return luminance > 0.6 ? '#1a1b1e' : '#ffffff';
  }

  const WEEKDAY_NAMES_JA = ['日', '月', '火', '水', '木', '金', '土'];

  // 日本の祝日計算（内閣府の祝日法に基づく）
  // 春分の日・秋分の日は1980〜2099年で有効な近似式（国立天文台の実測値と一致することを確認済み）。
  function nthWeekdayOfMonth(year, month, weekday, n) {
    // weekday: 0=日曜 ... 6=土曜, month: 1-12
    const first = new Date(year, month - 1, 1);
    const firstDow = first.getDay();
    const offset = (weekday - firstDow + 7) % 7;
    const day = 1 + offset + (n - 1) * 7;
    return day;
  }

  function vernalEquinoxDay(year) {
    return Math.floor(20.8431 + 0.242194 * (year - 1980)) - Math.floor((year - 1980) / 4);
  }

  function autumnalEquinoxDay(year) {
    return Math.floor(23.2488 + 0.242194 * (year - 1980)) - Math.floor((year - 1980) / 4);
  }

  function baseHolidaysForYear(year) {
    const list = [
      { date: formatDate(year, 0, 1), name: '元日' },
      { date: formatDate(year, 0, nthWeekdayOfMonth(year, 1, 1, 2)), name: '成人の日' },
      { date: formatDate(year, 1, 11), name: '建国記念の日' },
      { date: formatDate(year, 1, 23), name: '天皇誕生日' },
      { date: formatDate(year, 2, vernalEquinoxDay(year)), name: '春分の日' },
      { date: formatDate(year, 3, 29), name: '昭和の日' },
      { date: formatDate(year, 4, 3), name: '憲法記念日' },
      { date: formatDate(year, 4, 4), name: 'みどりの日' },
      { date: formatDate(year, 4, 5), name: 'こどもの日' },
      { date: formatDate(year, 6, nthWeekdayOfMonth(year, 7, 1, 3)), name: '海の日' },
      { date: formatDate(year, 7, 11), name: '山の日' },
      { date: formatDate(year, 8, nthWeekdayOfMonth(year, 9, 1, 3)), name: '敬老の日' },
      { date: formatDate(year, 8, autumnalEquinoxDay(year)), name: '秋分の日' },
      { date: formatDate(year, 9, nthWeekdayOfMonth(year, 10, 1, 2)), name: 'スポーツの日' },
      { date: formatDate(year, 10, 3), name: '文化の日' },
      { date: formatDate(year, 10, 23), name: '勤労感謝の日' }
    ];
    const map = {};
    list.forEach(h => { map[h.date] = h.name; });
    return map;
  }

  const holidayCache = {};

  function getHolidaysForYear(year) {
    if (!holidayCache[year]) {
      const base = baseHolidaysForYear(year);
      const result = Object.assign({}, base);

      // 振替休日：祝日が日曜のとき、直後の祝日でない平日を休日にする
      Object.keys(base).forEach(dateStr => {
        const d = new Date(dateStr + 'T00:00:00');
        if (d.getDay() === 0) {
          let nd = new Date(d);
          do {
            nd.setDate(nd.getDate() + 1);
          } while (result[formatDate(nd.getFullYear(), nd.getMonth(), nd.getDate())]);
          result[formatDate(nd.getFullYear(), nd.getMonth(), nd.getDate())] = '振替休日';
        }
      });

      // 国民の休日：前後を祝日に挟まれた（日曜でない）平日を休日にする
      Object.keys(base).forEach(dateStr => {
        const d = new Date(dateStr + 'T00:00:00');
        const next = new Date(d);
        next.setDate(next.getDate() + 1);
        const nextStr = formatDate(next.getFullYear(), next.getMonth(), next.getDate());
        const prevOfNext = new Date(next);
        prevOfNext.setDate(prevOfNext.getDate() - 1);
        if (!base[nextStr] && next.getDay() !== 0) {
          const afterNext = new Date(next);
          afterNext.setDate(afterNext.getDate() + 1);
          const afterNextStr = formatDate(afterNext.getFullYear(), afterNext.getMonth(), afterNext.getDate());
          if (base[dateStr] && base[afterNextStr]) {
            result[nextStr] = '国民の休日';
          }
        }
      });

      holidayCache[year] = result;
    }
    return holidayCache[year];
  }

  async function updateCalendarSettings(patch) {

  function renderCalendar() {
    calendarTitle.textContent = `${viewYear}年${viewMonth + 1}月`;
    calendarGrid.innerHTML = '';

    const firstDayOfWeek = new Date(viewYear, viewMonth, 1).getDay();
    const leadingEmpty = (firstDayOfWeek - calendarSettings.weekStart + 7) % 7;
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

    for (let i = 0; i < leadingEmpty; i++) {
      const empty = document.createElement('div');
      empty.className = 'day-cell empty';
      calendarGrid.appendChild(empty);
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const dateStr = formatDate(viewYear, viewMonth, day);
      const dow = new Date(viewYear, viewMonth, day).getDay();
      const cell = document.createElement('div');
      cell.className = 'day-cell';
      cell.dataset.date = dateStr;

      if (dateStr === todayStr()) {
        cell.classList.add('today');
      }
      if (dateStr === selectedDate) {
        cell.classList.add('selected');
      }
      if (calendarSettings.weekdayColor) {
        if (dow === 0) cell.classList.add('sun-text');
        if (dow === 6) cell.classList.add('sat-text');
      }
      if (calendarSettings.weekdayBg) {
        if (dow === 0) cell.classList.add('sun-bg');
        if (dow === 6) cell.classList.add('sat-bg');
      }
      const holidayName = getHolidaysForYear(viewYear)[dateStr];
      if (holidayName) {
        cell.title = holidayName;
        if (calendarSettings.weekdayColor) {
          cell.classList.add('holiday-text');
        }
        if (calendarSettings.weekdayBg) {
          cell.classList.add('holiday-bg');
        }
      }

      const header = document.createElement('div');
      header.className = 'day-cell-header';

      const dayNumber = document.createElement('span');
      dayNumber.className = 'day-number';
      dayNumber.textContent = day;
      header.appendChild(dayNumber);

      const rokuyo = getRokuyo(viewYear, viewMonth + 1, day);
      const rokuyoLabel = document.createElement('span');
      rokuyoLabel.className = 'rokuyo';
      if (rokuyo === '大安') rokuyoLabel.classList.add('taian');
      if (rokuyo === '仏滅') rokuyoLabel.classList.add('butsumetsu');
      rokuyoLabel.textContent = rokuyo;
      header.appendChild(rokuyoLabel);

      cell.appendChild(header);

      if (holidayName) {
        const holidayLabel = document.createElement('div');
        holidayLabel.className = 'holiday-label';
        holidayLabel.textContent = holidayName;
        cell.appendChild(holidayLabel);
      }

      const dayTasks = tasks.filter(t => taskOccursOnDate(t, dateStr));
      if (dayTasks.length > 0) {
        const taskListEl = document.createElement('div');
        taskListEl.className = 'day-cell-tasks';
        dayTasks.forEach(t => {
          const item = document.createElement('div');
          item.className = 'day-cell-task' + (t.completed ? ' completed' : '');
          const repeatMark = t.repeat ? '🔁 ' : '';
          item.textContent = t.time ? `${repeatMark}${t.time} ${t.text}` : `${repeatMark}${t.text}`;
          if (t.color) {
            item.style.backgroundColor = t.color;
            item.style.color = getContrastTextColor(t.color);
          }
          item.draggable = true;
          item.addEventListener('dragstart', (e) => {
            e.stopPropagation();
            e.dataTransfer.setData('text/plain', String(t.id));
            e.dataTransfer.effectAllowed = 'move';
          });
          taskListEl.appendChild(item);
        });
        cell.appendChild(taskListEl);
      }

      calendarGrid.appendChild(cell);
    }
  }

  // ゴミ箱アイコン（PC版のテキストラベル横／スマホ版のアイコンボタンで共通使用）
  const TRASH_ICON_SVG =
    '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<polyline points="3 6 5 6 21 6"></polyline>' +
    '<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>' +
    '<line x1="10" y1="11" x2="10" y2="17"></line>' +
    '<line x1="14" y1="11" x2="14" y2="17"></line>' +
    '</svg>';

  function renderTasks() {
    taskList.innerHTML = '';

    const visibleTasks = tasks.filter(t => taskOccursOnDate(t, selectedDate));

    filterLabel.textContent = `${selectedDate} の予定`;

    if (visibleTasks.length === 0) {
      const empty = document.createElement('li');
      empty.className = 'empty-message';
      empty.textContent = 'タスクがありません';
      taskList.appendChild(empty);
      return;
    }

    visibleTasks.forEach(task => {
      const li = document.createElement('li');
      li.dataset.id = task.id;

      const row = document.createElement('div');
      row.className = 'task-row';

      const avatarColor = task.color || '#6c8cff';
      const avatar = document.createElement('span');
      avatar.className = 'task-avatar';
      avatar.textContent = task.text.trim().charAt(0).toUpperCase() || '?';
      avatar.style.backgroundColor = avatarColor;
      avatar.style.color = getContrastTextColor(avatarColor);

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = task.completed;
      checkbox.className = 'toggle-checkbox';

      row.appendChild(avatar);
      row.appendChild(checkbox);

      if (editingTaskId === task.id) {
        const editInput = document.createElement('input');
        editInput.type = 'text';
        editInput.className = 'task-edit-input';
        editInput.value = task.text;

        const editDateInput = document.createElement('input');
        editDateInput.type = 'date';
        editDateInput.className = 'task-edit-date-input';
        editDateInput.value = task.date || '';

        const editTimeInput = document.createElement('input');
        editTimeInput.type = 'time';
        editTimeInput.className = 'task-edit-time-input';
        editTimeInput.value = task.time || '';

        const editColorInput = document.createElement('input');
        editColorInput.type = 'color';
        editColorInput.className = 'task-edit-color-input';
        editColorInput.value = task.color || '#6c8cff';
        editColorInput.title = 'タスクの色';

        const cancelEdit = () => {
          editingTaskId = null;
          renderTasks();
        };

        const commitEdit = () => {
          const trimmed = editInput.value.trim();
          if (trimmed) {
            patchTask(task.id, {
              text: trimmed,
              date: editDateInput.value || null,
              time: editTimeInput.value || null,
              color: editColorInput.value
            });
          }
          editingTaskId = null;
          renderTasks();
        };

        editInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            commitEdit();
          } else if (e.key === 'Escape') {
            cancelEdit();
          }
        });

        const saveBtn = document.createElement('button');
        saveBtn.type = 'button';
        saveBtn.className = 'edit-save-btn';
        saveBtn.textContent = '保存';
        saveBtn.addEventListener('click', commitEdit);

        const cancelBtn = document.createElement('button');
        cancelBtn.type = 'button';
        cancelBtn.className = 'edit-cancel-btn';
        cancelBtn.textContent = 'キャンセル';
        cancelBtn.addEventListener('click', cancelEdit);

        row.appendChild(editInput);
        row.appendChild(editDateInput);
        row.appendChild(editTimeInput);
        row.appendChild(editColorInput);
        row.appendChild(saveBtn);
        row.appendChild(cancelBtn);
      } else {
        const span = document.createElement('span');
        span.className = 'task-text' + (task.completed ? ' completed' : '');
        span.textContent = task.repeat ? `🔁 ${task.text}` : task.text;
        span.title = 'ダブルクリックで編集';
        span.addEventListener('dblclick', () => {
          editingTaskId = task.id;
          renderTasks();
        });
        row.appendChild(span);
      }

      if (task.date && editingTaskId !== task.id) {
        const dateLabel = document.createElement('span');
        dateLabel.className = 'task-date';
        dateLabel.textContent = task.time ? `${task.date} ${task.time}` : task.date;
        row.appendChild(dateLabel);
      }

      if (editingTaskId !== task.id) {
        const editBtn = document.createElement('button');
        editBtn.className = 'edit-btn';
        editBtn.title = '編集';
        editBtn.innerHTML = '<span class="btn-text">✏️ 編集</span>' +
          '<span class="btn-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"></path>' +
          '</svg></span>';
        editBtn.addEventListener('click', () => {
          editingTaskId = task.id;
          renderTasks();
        });
        row.appendChild(editBtn);

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.title = '削除';
        deleteBtn.innerHTML =
          '<span class="btn-text">' + TRASH_ICON_SVG + ' 削除</span>' +
          '<span class="btn-icon">' + TRASH_ICON_SVG + '</span>';
        row.appendChild(deleteBtn);
      }

      li.appendChild(row);

      if (task.detail) {
        const detail = document.createElement('p');
        detail.className = 'task-detail';
        detail.textContent = task.detail;
        li.appendChild(detail);
      }

      taskList.appendChild(li);
    });

    if (editingTaskId !== null) {
      const activeInput = taskList.querySelector('.task-edit-input');
      if (activeInput) {
        activeInput.focus();
        activeInput.select();
      }
    }
  }

  function buildRepeatFromInputs() {
    const type = taskRepeatSelect.value;
    if (type === 'daily') {
      return { type: 'daily' };
    }
    if (type === 'weekly') {
      const weekdays = Array.from(weekdayCheckboxes)
        .filter(cb => cb.checked)
        .map(cb => Number(cb.value));
      if (weekdays.length === 0) return null;
      return { type: 'weekly', weekdays: weekdays };
    }
    if (type === 'monthly') {
      const day = Number(taskRepeatMonthday.value);
      if (day >= 1 && day <= 31) {
        return { type: 'monthly', day: day };
      }
    }
    if (type === 'custom') {
      const interval = Number(taskRepeatInterval.value);
      if (interval >= 1) {
        return { type: 'custom', interval: interval };
      }
    }
    return null;
  }

  function resetRepeatInputs() {
    taskRepeatSelect.value = 'none';
    weekdayCheckboxes.forEach(cb => { cb.checked = false; });
    taskRepeatMonthday.value = '';
    taskRepeatInterval.value = '';
    repeatWeekdayGroup.hidden = true;
    repeatMonthdayGroup.hidden = true;
    repeatCustomGroup.hidden = true;
  }

  async function addTask() {
    const text = taskInput.value.trim();
    if (!text) return;

    await createTask({
      text: text,
      completed: false,
      date: taskDateInput.value || null,
      time: taskTimeInput.value || null,
      detail: taskDetailInput.value.trim() || null,
      color: taskColorInput.value,
      repeat: buildRepeatFromInputs()
    });

    addTaskDialog.close();
  }

  function resetAddForm() {
    taskInput.value = '';
    taskDateInput.value = '';
    taskTimeInput.value = '';
    taskDetailInput.value = '';
    resetRepeatInputs();
  }

  function toggleTask(id) {
    const task = tasks.find(t => t.id === id);
    if (task) {
      patchTask(id, { completed: !task.completed });
    }
  }

  function deleteTask(id) {
    removeTask(id);
  }

  function openAddTaskDialog(dateStr) {
    taskDateInput.value = dateStr;
    if (!addTaskDialog.open) {
      addTaskDialog.showModal();
    }
    taskInput.focus();
  }

  function selectDate(dateStr) {
    selectedDate = dateStr;
    editingTaskId = null;
    renderCalendar();
    renderTasks();
  }

  taskRepeatSelect.addEventListener('change', () => {
    const type = taskRepeatSelect.value;
    repeatWeekdayGroup.hidden = type !== 'weekly';
    repeatMonthdayGroup.hidden = type !== 'monthly';
    repeatCustomGroup.hidden = type !== 'custom';
  });

  addBtn.addEventListener('click', addTask);

  addDialogCancelBtn.addEventListener('click', () => {
    addTaskDialog.close();
  });

  openAddDialogBtn.addEventListener('click', () => {
    openAddTaskDialog(selectedDate);
  });

  addTaskDialog.addEventListener('click', (e) => {
    if (e.target === addTaskDialog) {
      addTaskDialog.close();
    }
  });

  addTaskDialog.addEventListener('close', () => {
    resetAddForm();
  });

  taskList.addEventListener('click', (e) => {
    const li = e.target.closest('li');
    if (!li || !li.dataset.id) return;
    const id = li.dataset.id;

    if (e.target.classList.contains('toggle-checkbox')) {
      toggleTask(id);
    } else if (e.target.classList.contains('delete-btn')) {
      deleteTask(id);
    }

  calendarGrid.addEventListener('click', (e) => {
    const cell = e.target.closest('.day-cell');
    if (!cell || cell.classList.contains('empty')) return;
    selectDate(cell.dataset.date);
  });

  calendarGrid.addEventListener('dragover', (e) => {
    const cell = e.target.closest('.day-cell');
    if (!cell || cell.classList.contains('empty')) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    cell.classList.add('drag-over');
  });

  calendarGrid.addEventListener('dragleave', (e) => {
    const cell = e.target.closest('.day-cell');
    if (cell) cell.classList.remove('drag-over');
  });

  calendarGrid.addEventListener('drop', (e) => {
    const cell = e.target.closest('.day-cell');
    if (!cell || cell.classList.contains('empty')) return;
    e.preventDefault();
    cell.classList.remove('drag-over');

    const taskId = e.dataTransfer.getData('text/plain');
    patchTask(taskId, { date: cell.dataset.date });
  });

  // --- スマホ向け：タスク一覧を長押し→スライドでカレンダーの日付に移動 ---
  const LONG_PRESS_MS = 450;
  const LONG_PRESS_MOVE_TOLERANCE = 16;

  let touchPressTimer = null;
  let touchDragActive = false;
  let touchDragGhost = null;

  function clearTouchPressTimer() {
    if (touchPressTimer) {
      clearTimeout(touchPressTimer);
      touchPressTimer = null;
    }
  }

  function clearDragOverCells() {
    document.querySelectorAll('.day-cell.drag-over').forEach((el) => el.classList.remove('drag-over'));
  }

  function positionTouchGhost(x, y) {
    if (touchDragGhost) {
      touchDragGhost.style.left = x + 'px';
      touchDragGhost.style.top = y + 'px';
    }
  }

  function updateTouchDragTarget(x, y) {
    clearDragOverCells();
    const el = document.elementFromPoint(x, y);
    const cell = el ? el.closest('.day-cell') : null;
    if (cell && !cell.classList.contains('empty')) {
      cell.classList.add('drag-over');
      return cell;
    }
    return null;
  }

  let lockedScrollY = 0;

  function lockPageScroll() {
    lockedScrollY = window.scrollY || window.pageYOffset || 0;
    document.body.style.position = 'fixed';
    document.body.style.top = '-' + lockedScrollY + 'px';
    document.body.style.left = '0';
    document.body.style.right = '0';
    document.body.style.width = '100%';
  }

  function unlockPageScroll() {
    document.body.style.position = '';
    document.body.style.top = '';
    document.body.style.left = '';
    document.body.style.right = '';
    document.body.style.width = '';
    window.scrollTo(0, lockedScrollY);
  }

  function startTouchDrag(li, taskText, x, y) {
    touchDragActive = true;
    li.classList.add('dragging-source');
    li.style.touchAction = 'none';

    // カレンダーが見えるようページ最上部までスクロールしてから、ページ全体を固定する
    window.scrollTo(0, 0);
    lockPageScroll();

    touchDragGhost = document.createElement('div');
    touchDragGhost.className = 'drag-ghost';
    touchDragGhost.textContent = taskText;
    document.body.appendChild(touchDragGhost);
    positionTouchGhost(x, y);

    if (window.navigator && typeof window.navigator.vibrate === 'function') {
      window.navigator.vibrate(15);
    }
  }

  function finishTouchDrag(li, taskId, x, y) {
    const cell = updateTouchDragTarget(x, y);
    clearDragOverCells();
    li.classList.remove('dragging-source');
    li.style.touchAction = '';
    unlockPageScroll();
    if (touchDragGhost) {
      touchDragGhost.remove();
      touchDragGhost = null;
    }
    touchDragActive = false;
    if (cell) {
      patchTask(taskId, { date: cell.dataset.date });
    }
  }

  function cancelTouchDrag(li) {
    clearTouchPressTimer();
    if (touchDragActive) {
      li.classList.remove('dragging-source');
      li.style.touchAction = '';
      unlockPageScroll();
      clearDragOverCells();
      if (touchDragGhost) {
        touchDragGhost.remove();
        touchDragGhost = null;
      }
      touchDragActive = false;
    }
  }

  taskList.addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'touch' && e.pointerType !== 'pen') return;

    const li = e.target.closest('li');
    if (!li || !li.dataset.id) return;
    if (e.target.closest('input, button')) return;

    const taskId = li.dataset.id;
    const taskTextEl = li.querySelector('.task-text');
    const taskText = taskTextEl ? taskTextEl.textContent : 'タスク';
    const startX = e.clientX;
    const startY = e.clientY;
    const pointerId = e.pointerId;
    let lastY = startY;
    let isScrolling = false;

    clearTouchPressTimer();
    touchPressTimer = setTimeout(() => {
      touchPressTimer = null;
      startTouchDrag(li, taskText, startX, startY);
    }, LONG_PRESS_MS);

    const onMove = (moveEvent) => {
      if (moveEvent.pointerId !== pointerId) return;

      if (!touchDragActive) {
        const dx = moveEvent.clientX - startX;
        const dy = moveEvent.clientY - startY;
        if (!isScrolling && Math.hypot(dx, dy) > LONG_PRESS_MOVE_TOLERANCE) {
          // 長押しが成立する前に指が動いた＝スクロールしたいという意思とみなす。
          // touch-action: none にしてあるため、ブラウザ標準のスクロールは発生しない。
          // ここから先はJSでリストのスクロールを手動で肩代わりする。
          clearTouchPressTimer();
          isScrolling = true;
        }
        if (isScrolling) {
          moveEvent.preventDefault();
          taskList.scrollTop -= (moveEvent.clientY - lastY);
        }
        lastY = moveEvent.clientY;
        return;
      }

      moveEvent.preventDefault();
      positionTouchGhost(moveEvent.clientX, moveEvent.clientY);
      updateTouchDragTarget(moveEvent.clientX, moveEvent.clientY);
    };

    const onUp = (upEvent) => {
      if (upEvent.pointerId !== pointerId) return;
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onCancel);
      clearTouchPressTimer();
      if (touchDragActive) {
        finishTouchDrag(li, taskId, upEvent.clientX, upEvent.clientY);
      }
    };

    const onCancel = () => {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onCancel);
      cancelTouchDrag(li);
    };

    document.addEventListener('pointermove', onMove, { passive: false });
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onCancel);
  });

  prevMonthBtn.addEventListener('click', () => {
    viewMonth--;
    if (viewMonth < 0) {
      viewMonth = 11;
      viewYear--;
    }
    renderCalendar();

  readOtherCalendarFetchBtn.addEventListener('click', async () => {
    const otherId = readOtherCalendarIdInput.value.trim();

    if (!otherId) {
      readOtherCalendarResult.innerHTML = '<p class="result-error">予定表のIDを入力してください。</p>';
      return;
    }
    if (!db) {
      readOtherCalendarResult.innerHTML = '<p class="result-error">インターネットに接続されていないため読み取れません。</p>';
      return;

    readOtherCalendarResult.innerHTML = '<p class="result-empty">読み込み中...</p>';
    try {

        row.textContent = `${dateLabel}　${t.text}`;
        readOtherCalendarResult.appendChild(row);

    } catch (err) {
      console.warn('他のカレンダーの読み込みに失敗しました', err);
      readOtherCalendarResult.innerHTML = '<p class="result-error">読み込みに失敗しました。IDを確認してください。</p>';
    }

  openBgPhotoDialogBtn.addEventListener('click', () => {

  weekdaySettingsBtn.addEventListener('click', () => {
    headerSettingsMenu.hidden = true;
    applyCalendarSettingsToInputs();

  weekStartSelect.addEventListener('change', () => {

  // FirestoreはドキュメントごとにDB側のサイズ上限がある（約1MB）。
  // 元画像のサイズに関わらず、保存前にブラウザ側で自動的に縮小・圧縮してこの上限に収める。
  const MAX_BG_IMAGE_BYTES = 900 * 1024;
  const MAX_BG_IMAGE_DIMENSION = 1600;

  function loadImageFromFile(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        resolve(img);
      };
      img.onerror = (err) => {
        URL.revokeObjectURL(url);
        reject(err);
      };
      img.src = url;
    });
  }

  async function compressImageToDataUrl(file, maxBytes, maxDimension) {
    const img = await loadImageFromFile(file);

    let width = img.naturalWidth;
    let height = img.naturalHeight;
    if (width > maxDimension || height > maxDimension) {
      if (width >= height) {
        height = Math.round(height * (maxDimension / width));
        width = maxDimension;
      } else {
        width = Math.round(width * (maxDimension / height));
        height = maxDimension;
      }
    }

    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    canvas.getContext('2d').drawImage(img, 0, 0, width, height);

    // 画質を段階的に下げながら、Firestoreのサイズ上限に収まるまで圧縮する
    let quality = 0.85;
    let dataUrl = canvas.toDataURL('image/jpeg', quality);
    while (dataUrl.length > maxBytes && quality > 0.3) {
      quality -= 0.1;
      dataUrl = canvas.toDataURL('image/jpeg', quality);
    }
    return dataUrl;
  }

  calendarBgInput.addEventListener('change', async () => {
    const file = calendarBgInput.files[0];
    if (!file) return;

    let dataUrl;
    try {
      dataUrl = await compressImageToDataUrl(file, MAX_BG_IMAGE_BYTES, MAX_BG_IMAGE_DIMENSION);
    } catch (err) {
      console.warn('背景写真の読み込みに失敗しました', err);
      alert('画像の読み込みに失敗しました。別の画像を試してください。');
      calendarBgInput.value = '';
      return;
    }

    applyCalendarBg(dataUrl);

    if (settingsDocRef) {
      try {
        await settingsDocRef.set({ dataUrl });
      } catch (err) {
        console.warn('背景写真の同期に失敗しました', err);
      }
    } else {
      try {
        localStorage.setItem(LOCAL_BG_KEY, dataUrl);
      } catch (err) {
        console.warn('背景画像の保存に失敗しました（サイズが大きすぎる可能性があります）', err);
      }
    }
    bgPhotoSettingsDialog.close();
  });

  calendarBgResetBtn.addEventListener('click', async () => {
    applyCalendarBg(null);
    localStorage.removeItem(LOCAL_BG_KEY);
    calendarBgInput.value = '';

    if (settingsDocRef) {
      try {
        await settingsDocRef.set({ dataUrl: null });
      } catch (err) {
        console.warn('背景写真のリセットに失敗しました', err);
      }
    }

    bgPhotoSettingsDialog.close();
  });

  exportLocalTasksBtn.addEventListener('click', () => {
    headerSettingsMenu.hidden = true;
    const raw = localStorage.getItem(LOCAL_TASKS_KEY);
    const localTasks = raw ? JSON.parse(raw) : [];
    if (localTasks.length === 0) {
      alert('この端末のブラウザにはローカル保存されたタスクがありません。');
      return;
    }
    window.prompt(
      `${localTasks.length}件のタスクが見つかりました。下のテキストを全選択してコピーし、チャットに貼り付けてください。`,
      JSON.stringify(localTasks)
    );
  });

  initStore();
