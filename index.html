<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スケジューラー（Todo兼用）</title>
<style>
  :root {
    --bg: #1a1b1e;
    --card-bg: #232428;
    --border: #33343a;
    --text: #e8e8ea;
    --text-muted: #8b8d94;
    --accent: #6c8cff;
    --accent-hover: #8aa4ff;
    --danger: #ff6b6b;
    --danger-hover: #ff8787;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .app {
    width: 80vw;
    height: 80vh;
    display: flex;
    flex-direction: column;
  }

  h1 {
    margin: 0 0 20px;
    font-size: 1.8rem;
    text-align: center;
  }

  .layout {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 24px;
    align-items: stretch;
  }

  .panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .calendar-panel {
    flex: 6;
    min-width: 0;
    background: #f0f0f2;
    color: #1a1b1e;
  }

  .calendar-panel .calendar-header h2 {
    color: #1a1b1e;
  }

  .calendar-panel .month-nav-btn {
    background: #f2f2f4;
    color: #1a1b1e;
    border: 1px solid #dcdde0;
  }

  .calendar-panel .month-nav-btn:hover {
    background: #e4e5e8;
  }

  .calendar-panel .weekday {
    color: #8b8d94;
  }

  .calendar-panel .day-cell:hover {
    background: #e2e2e6;
  }

  .calendar-panel .day-cell.today {
    border-color: var(--accent);
  }

  .calendar-panel .day-cell.selected {
    background: var(--accent);
    color: #fff;
  }

  .calendar-panel .day-cell-task {
    background: rgba(108, 140, 255, 0.15);
    color: #2b3a67;
  }

  .calendar-panel .day-cell.selected .day-cell-task {
    background: rgba(255, 255, 255, 0.3);
    color: #fff;
  }

  .task-column {
    flex: 4;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .add-panel {
    flex: 0 0 auto;
  }

  .list-panel {
    flex: 1;
    min-height: 0;
  }

  .panel-title {
    margin: 0 0 16px;
    font-size: 1.2rem;
  }

  /* --- カレンダー --- */
  .calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .calendar-header h2 {
    margin: 0;
    font-size: 1.4rem;
  }

  .month-nav-btn {
    border: 1px solid var(--border);
    background: #1e1f23;
    color: var(--text);
    border-radius: 6px;
    padding: 10px 16px;
    cursor: pointer;
    font-size: 1rem;
  }

  .month-nav-btn:hover {
    background: var(--border);
  }

  .weekday-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    margin-bottom: 8px;
  }

  .weekday {
    text-align: center;
    font-size: 0.95rem;
    color: var(--text-muted);
    padding: 4px 0;
  }

  .calendar-grid {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-auto-rows: 1fr;
    gap: 8px;
  }

  .day-cell {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    border-radius: 10px;
    cursor: pointer;
    position: relative;
    padding: 6px;
    overflow: hidden;
  }

  .day-cell:hover {
    background: var(--border);
  }

  .day-cell.empty {
    cursor: default;
  }

  .day-cell.empty:hover {
    background: transparent;
  }

  .day-cell.today {
    border: 2px solid var(--accent);
  }

  .day-cell.selected {
    background: var(--accent);
    color: #fff;
  }

  .day-cell-header {
    width: 100%;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 4px;
    margin-bottom: 4px;
    flex-shrink: 0;
  }

  .day-number {
    font-size: 1rem;
    font-weight: 600;
  }

  .rokuyo {
    font-size: 0.65rem;
    color: #9a9a9a;
    white-space: nowrap;
  }

  .rokuyo.taian {
    color: #d32f2f;
    font-weight: 600;
  }

  .rokuyo.butsumetsu {
    color: #bdbdbd;
  }

  .day-cell.selected .rokuyo {
    color: rgba(255, 255, 255, 0.85);
  }

  .day-cell.selected .rokuyo.taian,
  .day-cell.selected .rokuyo.butsumetsu {
    color: #fff;
  }

  .day-cell-tasks {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: hidden;
  }

  .day-cell-task {
    width: 100%;
    font-size: 0.72rem;
    padding: 1px 5px;
    border-radius: 4px;
    background: rgba(108, 140, 255, 0.25);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .day-cell-task.completed {
    text-decoration: line-through;
    opacity: 0.6;
  }

  .day-cell.selected .day-cell-task {
    background: rgba(255, 255, 255, 0.3);
    color: #fff;
  }

  .filter-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    gap: 8px;
  }

  .filter-label {
    font-size: 1rem;
    color: var(--text-muted);
  }

  .show-all-btn {
    border: 1px solid var(--border);
    background: #1e1f23;
    color: var(--text);
    border-radius: 6px;
    padding: 8px 14px;
    cursor: pointer;
    font-size: 0.95rem;
  }

  .show-all-btn:hover {
    background: var(--border);
  }

  .show-all-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .show-all-btn:disabled:hover {
    background: #1e1f23;
  }

  /* --- タスク入力 --- */
  .input-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  #task-input {
    flex: 1;
    min-width: 120px;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #1e1f23;
    color: var(--text);
    font-size: 1.05rem;
    outline: none;
  }

  #task-date-input {
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #1e1f23;
    color: var(--text);
    font-size: 1rem;
    outline: none;
    color-scheme: dark;
  }

  #task-input:focus,
  #task-date-input:focus {
    border-color: var(--accent);
  }

  #add-btn {
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 1.05rem;
    cursor: pointer;
  }

  #add-btn:hover {
    background: var(--accent-hover);
  }

  /* --- タスク一覧（右下） --- */
  #task-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  #task-list li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 4px;
    border-bottom: 1px solid var(--border);
  }

  #task-list li:last-child {
    border-bottom: none;
  }

  #task-list input[type="checkbox"] {
    width: 20px;
    height: 20px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }

  .task-text {
    flex: 1;
    word-break: break-word;
    font-size: 1.05rem;
  }

  .task-text.completed {
    text-decoration: line-through;
    color: var(--text-muted);
  }

  .task-date {
    font-size: 0.85rem;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .delete-btn {
    border: none;
    background: transparent;
    color: var(--danger);
    font-size: 0.95rem;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 6px;
  }

  .delete-btn:hover {
    color: var(--danger-hover);
    background: rgba(255, 107, 107, 0.1);
  }

  .empty-message {
    text-align: center;
    color: var(--text-muted);
    padding: 16px 0;
  }
</style>
</head>
<body>
  <div class="app">
    <h1>スケジューラー（Todo兼用）</h1>
    <div class="layout">
      <div class="panel calendar-panel">
        <div class="calendar-header">
          <button class="month-nav-btn" id="prev-month-btn">&lt; 前月</button>
          <h2 id="calendar-title"></h2>
          <button class="month-nav-btn" id="next-month-btn">次月 &gt;</button>
        </div>
        <div class="weekday-row">
          <span class="weekday">日</span>
          <span class="weekday">月</span>
          <span class="weekday">火</span>
          <span class="weekday">水</span>
          <span class="weekday">木</span>
          <span class="weekday">金</span>
          <span class="weekday">土</span>
        </div>
        <div class="calendar-grid" id="calendar-grid"></div>
      </div>

      <div class="task-column">
        <div class="panel add-panel">
          <h2 class="panel-title">タスク追加</h2>
          <div class="input-row">
            <input type="text" id="task-input" placeholder="タスクを入力..." autocomplete="off">
            <input type="date" id="task-date-input">
            <button id="add-btn">追加</button>
          </div>
        </div>

        <div class="panel list-panel">
          <div class="filter-row">
            <span class="filter-label" id="filter-label">すべてのタスク</span>
            <button class="show-all-btn" id="show-all-btn">すべて表示</button>
          </div>
          <ul id="task-list"></ul>
        </div>
      </div>
    </div>
  </div>

<script>
  let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

  const today = new Date();
  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth();
  let selectedDate = null;

  const taskInput = document.getElementById('task-input');
  const taskDateInput = document.getElementById('task-date-input');
  const addBtn = document.getElementById('add-btn');
  const taskList = document.getElementById('task-list');
  const calendarGrid = document.getElementById('calendar-grid');
  const calendarTitle = document.getElementById('calendar-title');
  const prevMonthBtn = document.getElementById('prev-month-btn');
  const nextMonthBtn = document.getElementById('next-month-btn');
  const showAllBtn = document.getElementById('show-all-btn');
  const filterLabel = document.getElementById('filter-label');

  function saveTasks() {
    localStorage.setItem('tasks', JSON.stringify(tasks));
  }

  function formatDate(year, month, day) {
    const mm = String(month + 1).padStart(2, '0');
    const dd = String(day).padStart(2, '0');
    return `${year}-${mm}-${dd}`;
  }

  function todayStr() {
    return formatDate(today.getFullYear(), today.getMonth(), today.getDate());
  }

  // 簡易計算式（新暦の月日から近似）。旧暦を厳密に計算していないため実際の六曜とはずれる場合があります。
  const ROKUYO_NAMES = ['先勝', '友引', '先負', '仏滅', '大安', '赤口'];
  function getRokuyo(month, day) {
    return ROKUYO_NAMES[(month + day) % 6];
  }

  function renderCalendar() {
    calendarTitle.textContent = `${viewYear}年${viewMonth + 1}月`;
    calendarGrid.innerHTML = '';

    const firstDayOfWeek = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

    for (let i = 0; i < firstDayOfWeek; i++) {
      const empty = document.createElement('div');
      empty.className = 'day-cell empty';
      calendarGrid.appendChild(empty);
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const dateStr = formatDate(viewYear, viewMonth, day);
      const cell = document.createElement('div');
      cell.className = 'day-cell';
      cell.dataset.date = dateStr;

      if (dateStr === todayStr()) {
        cell.classList.add('today');
      }
      if (dateStr === selectedDate) {
        cell.classList.add('selected');
      }

      const header = document.createElement('div');
      header.className = 'day-cell-header';

      const dayNumber = document.createElement('span');
      dayNumber.className = 'day-number';
      dayNumber.textContent = day;
      header.appendChild(dayNumber);

      const rokuyo = getRokuyo(viewMonth + 1, day);
      const rokuyoLabel = document.createElement('span');
      rokuyoLabel.className = 'rokuyo';
      if (rokuyo === '大安') rokuyoLabel.classList.add('taian');
      if (rokuyo === '仏滅') rokuyoLabel.classList.add('butsumetsu');
      rokuyoLabel.textContent = rokuyo;
      header.appendChild(rokuyoLabel);

      cell.appendChild(header);

      const dayTasks = tasks.filter(t => t.date === dateStr);
      if (dayTasks.length > 0) {
        const taskListEl = document.createElement('div');
        taskListEl.className = 'day-cell-tasks';
        dayTasks.forEach(t => {
          const item = document.createElement('div');
          item.className = 'day-cell-task' + (t.completed ? ' completed' : '');
          item.textContent = t.text;
          taskListEl.appendChild(item);
        });
        cell.appendChild(taskListEl);
      }

      calendarGrid.appendChild(cell);
    }
  }

  function renderTasks() {
    taskList.innerHTML = '';

    const visibleTasks = selectedDate
      ? tasks.filter(t => t.date === selectedDate)
      : tasks;

    filterLabel.textContent = selectedDate
      ? `${selectedDate} のタスク`
      : 'すべてのタスク';
    showAllBtn.disabled = !selectedDate;

    if (visibleTasks.length === 0) {
      const empty = document.createElement('li');
      empty.className = 'empty-message';
      empty.textContent = 'タスクがありません';
      taskList.appendChild(empty);
      return;
    }

    visibleTasks.forEach(task => {
      const li = document.createElement('li');
      li.dataset.id = task.id;

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = task.completed;
      checkbox.className = 'toggle-checkbox';

      const span = document.createElement('span');
      span.className = 'task-text' + (task.completed ? ' completed' : '');
      span.textContent = task.text;

      li.appendChild(checkbox);
      li.appendChild(span);

      if (task.date) {
        const dateLabel = document.createElement('span');
        dateLabel.className = 'task-date';
        dateLabel.textContent = task.date;
        li.appendChild(dateLabel);
      }

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-btn';
      deleteBtn.textContent = '削除';
      li.appendChild(deleteBtn);

      taskList.appendChild(li);
    });
  }

  function addTask() {
    const text = taskInput.value.trim();
    if (!text) return;

    tasks.push({
      id: Date.now(),
      text: text,
      completed: false,
      date: taskDateInput.value || null
    });

    taskInput.value = '';
    taskDateInput.value = '';
    saveTasks();
    renderTasks();
    renderCalendar();
  }

  function toggleTask(id) {
    const task = tasks.find(t => t.id === id);
    if (task) {
      task.completed = !task.completed;
      saveTasks();
      renderTasks();
    }
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    saveTasks();
    renderTasks();
    renderCalendar();
  }

  function selectDate(dateStr) {
    selectedDate = dateStr;
    renderCalendar();
    renderTasks();
  }

  function clearDateFilter() {
    selectedDate = null;
    renderCalendar();
    renderTasks();
  }

  addBtn.addEventListener('click', addTask);

  taskList.addEventListener('click', (e) => {
    const li = e.target.closest('li');
    if (!li || !li.dataset.id) return;
    const id = Number(li.dataset.id);

    if (e.target.classList.contains('toggle-checkbox')) {
      toggleTask(id);
    } else if (e.target.classList.contains('delete-btn')) {
      deleteTask(id);
    }
  });

  calendarGrid.addEventListener('click', (e) => {
    const cell = e.target.closest('.day-cell');
    if (!cell || cell.classList.contains('empty')) return;
    selectDate(cell.dataset.date);
  });

  prevMonthBtn.addEventListener('click', () => {
    viewMonth--;
    if (viewMonth < 0) {
      viewMonth = 11;
      viewYear--;
    }
    renderCalendar();
  });

  nextMonthBtn.addEventListener('click', () => {
    viewMonth++;
    if (viewMonth > 11) {
      viewMonth = 0;
      viewYear++;
    }
    renderCalendar();
  });

  showAllBtn.addEventListener('click', clearDateFilter);

  renderCalendar();
  renderTasks();
</script>
</body>
</html>
